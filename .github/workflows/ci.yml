name: CI

on:
  push:
    branches: [master, wayfound-integration]
  pull_request:
    branches: [master, wayfound-integration]
  workflow_dispatch:

permissions:
  contents: read

# Workflow guards are defense in depth, NOT a security boundary for fork PRs:
# a fork PR can change the workflow itself. Keep the runner OFF until repository-
# level fork-workflow approval/runner admission restrictions are independently verified.
# Keep independent PR/push workflow histories: the single runner slot serializes jobs.

jobs:
  quality:
    name: Python ${{ matrix.python-version }}
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration'))
    runs-on: [self-hosted, Linux, X64, rzd-api, codence-rzd]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Select managed Python and isolated venv
        env:
          REQUESTED_PYTHON: ${{ matrix.python-version }}
        run: |
          set -euo pipefail
          test "$(id -un)" = rzd-runner
          test "$(id -u)" = 1003
          UV_BIN="$HOME/.local/bin/uv"
          test -x "$UV_BIN"
          python_path="$("$UV_BIN" python find --managed-python --no-python-downloads "$REQUESTED_PYTHON")"
          test -x "$python_path"
          CI_VENV="$(mktemp -d "$RUNNER_TEMP/rzd-quality.XXXXXXXX")"
          echo "CI_VENV=$CI_VENV" >> "$GITHUB_ENV"
          "$UV_BIN" venv --no-python-downloads --seed --python "$python_path" "$CI_VENV"
          "$CI_VENV/bin/python" - "$REQUESTED_PYTHON" <<'PY'
          import sys
          expected = tuple(map(int, sys.argv[1].split('.')))
          assert sys.version_info[:2] == expected, (sys.version, expected)
          print(f'Python {sys.version_info.major}.{sys.version_info.minor}.{sys.version_info.micro}')
          PY
      - name: Install project
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pip install --upgrade pip
          "$CI_VENV/bin/python" -m pip install -e '.[dev]'
      - name: Unit tests and coverage
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pytest tests/ -m 'not integration' --cov --cov-report=term-missing
      - name: Ruff
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          result=0
          "$CI_VENV/bin/ruff" check . || result=1
          "$CI_VENV/bin/ruff" format --check . || result=1
          exit "$result"
      - name: Mypy
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          "$CI_VENV/bin/mypy"
      - name: Build and metadata
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          mkdir -p "$CI_VENV/source" "$CI_VENV/dist"
          git archive HEAD | tar -x -C "$CI_VENV/source"
          (cd "$CI_VENV/source" && "$CI_VENV/bin/python" -m build --outdir "$CI_VENV/dist")
          "$CI_VENV/bin/twine" check "$CI_VENV"/dist/*
      - name: Dependency audit
        if: ${{ !cancelled() && matrix.python-version == '3.12' }}
        run: |
          set -euo pipefail
          "$CI_VENV/bin/pip-audit"
      - name: Remove this job's venv
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CI_VENV:-}" && "$CI_VENV" == "$RUNNER_TEMP"/rzd-quality.* && -d "$CI_VENV" ]]; then
            rm -rf -- "$CI_VENV"
          fi

  secrets:
    name: Secret scan
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration'))
    runs-on: [self-hosted, Linux, X64, rzd-api, codence-rzd]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full-history Gitleaks
        run: |
          set -euo pipefail
          test "$(id -un)" = rzd-runner
          test "$(id -u)" = 1003
          GITLEAKS_BIN="$HOME/.local/bin/gitleaks"
          if [[ ! -x "$GITLEAKS_BIN" ]]; then
            GITLEAKS_BIN="$(command -v gitleaks)"
          fi
          test -x "$GITLEAKS_BIN"
          "$GITLEAKS_BIN" git --redact --no-banner --exit-code=1 --log-opts='--all' .

  docker:
    name: Docker and MCP protocol
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration')) ||
      (github.event_name == 'workflow_dispatch' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/wayfound-integration'))
    runs-on: [self-hosted, Linux, X64, rzd-api, codence-rzd]
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      HOME: /home/rzd-runner
      XDG_RUNTIME_DIR: /run/user/1003
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/1003/bus
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check dedicated user and rootless environment
        run: |
          set -euo pipefail
          test "$(id -un)" = rzd-runner
          test "$(id -u)" = 1003
          test "$(id -u)" -ne 0
          test -d "$XDG_RUNTIME_DIR"
          test -O "$XDG_RUNTIME_DIR"
          command -v podman >/dev/null
          UV_BIN="$HOME/.local/bin/uv"
          test -x "$UV_BIN"
          python_path="$("$UV_BIN" python find --managed-python --no-python-downloads 3.12)"
          test -x "$python_path"
          CI_VENV="$(mktemp -d "$RUNNER_TEMP/rzd-mcp.XXXXXXXX")"
          echo "CI_VENV=$CI_VENV" >> "$GITHUB_ENV"
          "$UV_BIN" venv --no-python-downloads --seed --python "$python_path" "$CI_VENV"
          "$CI_VENV/bin/python" - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          PY
          if [[ ! -S "$XDG_RUNTIME_DIR/bus" ]]; then
            echo 'DBUS_SESSION_BUS_ADDRESS=' >> "$GITHUB_ENV"
          fi
      - name: Install MCP test client
        run: |
          set -euo pipefail
          "$CI_VENV/bin/python" -m pip install --upgrade pip
          "$CI_VENV/bin/python" -m pip install -e '.[dev]'
      - name: Build image
        run: |
          set -euo pipefail
          image="localhost/rzd-api-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CI_IMAGE=$image" >> "$GITHUB_ENV"
          podman --cgroup-manager=cgroupfs build --memory=512m -t "$image" .
      - name: Start container on loopback
        run: |
          set -euo pipefail
          container="rzd-api-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "CI_CONTAINER=$container" >> "$GITHUB_ENV"
          podman --cgroup-manager=cgroupfs run -d \
            --name "$container" --network=slirp4netns \
            --memory=384m --memory-swap=512m --pids-limit=64 \
            --cap-drop=all --security-opt=no-new-privileges \
            -p 127.0.0.1::8000 \
            -e MCP_AUTH_TOKEN=ci-token-00000000000000000000000000000000 \
            "$CI_IMAGE"
          address="$(podman --cgroup-manager=cgroupfs port "$container" 8000/tcp)"
          [[ "$address" =~ ^127\.0\.0\.1:[0-9]+$ ]]
          echo "CI_MCP_ADDRESS=$address" >> "$GITHUB_ENV"
      - name: Wait for healthcheck
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 "http://$CI_MCP_ADDRESS/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          podman --cgroup-manager=cgroupfs inspect --format '{{.State.Status}}' "$CI_CONTAINER"
          exit 1
      - name: MCP initialize and list tools
        env:
          MCP_AUTH_TOKEN: ci-token-00000000000000000000000000000000
        run: |
          set -euo pipefail
          MCP_TEST_URL="http://$CI_MCP_ADDRESS/mcp" \
            "$CI_VENV/bin/python" -m pytest tests/integration/test_mcp_container.py -m integration -v
      - name: Remove only this job's container, image and venv
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${CI_CONTAINER:-}" && "$CI_CONTAINER" == "rzd-api-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            if podman --cgroup-manager=cgroupfs container exists "$CI_CONTAINER"; then
              podman --cgroup-manager=cgroupfs rm -f "$CI_CONTAINER"
            fi
          fi
          if [[ -n "${CI_IMAGE:-}" && "$CI_IMAGE" == "localhost/rzd-api-ci:${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" ]]; then
            if podman --cgroup-manager=cgroupfs image exists "$CI_IMAGE"; then
              podman --cgroup-manager=cgroupfs rmi "$CI_IMAGE"
            fi
          fi
          if [[ -n "${CI_VENV:-}" && "$CI_VENV" == "$RUNNER_TEMP"/rzd-mcp.* && -d "$CI_VENV" ]]; then
            rm -rf -- "$CI_VENV"
          fi
